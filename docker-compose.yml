version: '3.9'
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aaas
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aaas
      REDIS_URL: redis://redis:6379
      ADMIN_JWT: local-admin-token
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis

volumes:
  pg-data:
